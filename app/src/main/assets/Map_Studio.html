<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Map Studio</title>
<style>
:root{--bg:#1e1e20;--p:#2d2d30;--p2:#3a3a3f;--in:#1b1b1d;--b:#161617;--t:#e6e6e6;--ac:#0b6cbc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#dcdcdc;--p:#f1f1f1;--p2:#dedede;--in:#fff;--b:#bdbdbd;--t:#1b1b1b}}
:root[data-theme="light"]{--bg:#dcdcdc;--p:#f1f1f1;--p2:#dedede;--in:#fff;--b:#bdbdbd;--t:#1b1b1b}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--t);font:13px system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column}
#rib{display:flex;gap:2px;overflow-x:auto;background:var(--p);border-bottom:1px solid var(--b);padding:4px;flex:0 0 auto;align-items:stretch}
.g{display:flex;gap:2px;align-items:center;padding:0 6px;border-right:1px solid var(--b)}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:46px;background:transparent;color:var(--t);border:1px solid transparent;border-radius:4px;font-size:17px;padding:2px 4px;flex:0 0 auto}
.tb small{font-size:10px;opacity:.85;margin-top:1px}
.tb.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tb:active{background:var(--p2)}
#rib select,#rib input[type=color]{height:28px;background:var(--in);color:var(--t);border:1px solid var(--b);border-radius:3px;font-size:12px}
#rib input[type=color]{width:34px;padding:1px}
.lb{font-size:10px;opacity:.8;display:flex;flex-direction:column;gap:2px;align-items:center}
#main{flex:1;display:flex;min-height:0}
#vp{flex:1;position:relative;min-width:0;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#dock{width:300px;display:flex;flex-direction:column;background:var(--p);border-left:1px solid var(--b)}
#tabs{display:flex;background:var(--p2)}
#tabs button{flex:1;padding:9px 4px;background:transparent;color:var(--t);border:0;border-bottom:2px solid transparent;font-size:12px}
#tabs button.on{border-bottom-color:var(--ac);background:var(--p)}
#pane{flex:1;overflow:auto;touch-action:pan-y;-webkit-user-select:text;user-select:text}
.pn{display:none}.pn.on{display:block}
.n{padding:7px 8px;border-bottom:1px solid var(--b);display:flex;gap:6px}
.n.c{padding-left:22px;cursor:pointer}.n.s{background:var(--ac);color:#fff}
.em{padding:14px;opacity:.7}
.sec{background:var(--p2);padding:5px 8px;font-weight:600;font-size:12px}
.r{display:flex;align-items:center;gap:6px;padding:4px 8px}
.r label{width:84px;opacity:.85;font-size:12px;flex:0 0 auto}
.v{display:flex;gap:4px;flex:1;min-width:0}
#pane input[type=number],#pane input[type=text],#pane select{background:var(--in);color:var(--t);border:1px solid var(--b);border-radius:3px;padding:6px 4px;font-size:12px;width:100%;min-width:0;box-sizing:border-box}
#pane input[type=color]{width:44px;height:30px;padding:1px;border:1px solid var(--b);background:var(--in)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px}
.tg button{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:10px 2px;font-size:11px}
.tg b{display:block;font-size:22px;font-weight:400}
@media (max-width:800px){#main{flex-direction:column}#dock{width:auto;height:40%;border-left:0;border-top:1px solid var(--b)}#dock.min{height:auto}#dock.min #pane{display:none}#pane input,#pane select{font-size:16px!important}}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9;align-items:flex-end}
#md .bx{background:var(--p);width:100%;max-height:80%;padding:10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
#md .rw{display:flex;gap:6px}
#md button{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:4px;padding:9px 12px}
#md button.on{background:var(--ac);color:#fff}
textarea{height:220px;direction:ltr;font:11px/1.4 ui-monospace,Menlo,monospace;background:var(--in);color:var(--t);border:1px solid var(--b);padding:6px;-webkit-user-select:text;user-select:text}
#wz,#ai{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9;align-items:flex-end}
#wz .bx,#ai .bx{background:var(--p);width:100%;max-height:85%;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;box-sizing:border-box}
#wz .rw,#ai .rw{display:flex;gap:6px;align-items:center}
#wz button,#ai button{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:4px;padding:9px 12px}
#wz button.on,#ai button.on{background:var(--ac);color:#fff}
#wz input[type=text],#wz input[type=number],#ai input[type=text],#wz input[type=number]{background:var(--in);color:var(--t);border:1px solid var(--b);border-radius:3px;padding:7px;font-size:16px;width:100%;min-width:0;box-sizing:border-box}
#wz input[type=file],#ai input[type=file]{font-size:13px;color:var(--t)}
.th{width:44px;height:44px;object-fit:cover;border-radius:4px;border:1px solid var(--b)}
.tt{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px}
.sb{background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:4px;padding:4px 8px;font-size:14px}
input[type=number]{direction:ltr}

#aip{height:84px;font:16px system-ui,sans-serif;direction:ltr;unicode-bidi:plaintext;text-align:start;border-radius:3px}
#ai input[type=password]{background:var(--in);color:var(--t);border:1px solid var(--b);border-radius:3px;padding:7px;font-size:16px;width:100%;min-width:0;box-sizing:border-box}
#ast{font-size:12px;min-height:16px;white-space:pre-wrap}
.ft{font-size:11px;background:var(--in);border:1px solid var(--b);border-radius:4px;padding:4px 6px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="rib">
<div class="g"><button class="tb on" data-tool="select">⬚<small>Select</small></button><button class="tb" data-tool="move">✥<small>Move</small></button><button class="tb" data-tool="scale">⤢<small>Scale</small></button><button class="tb" data-tool="rot">⟳<small>Rotate</small></button></div>
<div class="g"><button class="tb" id="addp">▣<small>Part</small></button><button class="tb" id="img">🖼<small>From Images</small></button><button class="tb" id="aib" style="background:var(--ac);color:#fff">✨<small>AI</small></button><select id="shp"><option value="block">Block</option><option value="ball">Sphere</option><option value="cyl">Cylinder</option><option value="wedge">Wedge</option></select></div>
<div class="g"><div class="lb">Color<input type="color" id="col" value="#a3a2a5"></div><div class="lb">Material<select id="mat"></select></div><button class="tb" id="anc">⚓<small>Anchor</small></button></div>
<div class="g"><div class="lb">Move<select id="im"><option>0.05</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>5</option></select></div><div class="lb">Rotate<select id="ir"><option>1</option><option>5</option><option>15</option><option selected>45</option><option>90</option></select></div></div>
<div class="g"><button class="tb" id="mu">☑<small>Multi</small></button><button class="tb" id="dup">⧉<small>Duplicate</small></button><button class="tb" id="gnd">⤓<small>Ground</small></button><button class="tb" id="del">🗑<small>Delete</small></button></div>
<div class="g"><button class="tb" id="un">↶<small>Undo</small></button><button class="tb" id="re">↷<small>Redo</small></button><button class="tb" id="ex" style="background:var(--ac);color:#fff">⬆<small>Publish</small></button><button class="tb" id="lang">🌐<small>EN / ع</small></button></div>
</div>
<div id="main">
<div id="vp"><canvas id="cv"></canvas></div>
<div id="dock"><div id="tabs"><button data-d="exp" class="on">Explorer</button><button data-d="props">Properties</button><button data-d="box">Toolbox</button></div>
<div id="pane"><div id="exp" class="pn on"></div><div id="props" class="pn"></div><div id="box" class="pn"></div></div></div>
</div>
<div id="md"><div class="bx">
<div class="rw"><button data-t="luau" class="on">Luau script</button><button data-t="xml">.rbxlx</button><span style="flex:1"></span><button id="cp" class="on">Copy</button><button id="cl">Close</button></div>
<div id="tip" style="font-size:12px"></div><textarea id="out" readonly></textarea></div></div>
<div id="wz"><div class="bx">
<div class="rw"><button data-wm="bld" class="on">Building</button><button data-wm="chr">Character</button><button data-wm="cut">Cutout</button></div>
<div id="wh" style="font-size:12px"></div>
<input type="file" id="wf" accept="image/*" multiple>
<div id="wp" class="rw" style="overflow-x:auto"></div>
<div class="rw"><label>Name</label><input type="text" id="wn"></div>
<div class="rw" id="wb"><label>Width</label><input type="number" id="ww" value="20"><label>Depth</label><input type="number" id="wd" value="20"><label>Floors</label><input type="number" id="wl" value="3"></div>
<div class="rw"><button id="wc" class="on">Create</button><button id="wx">Close</button></div>
</div></div>
<div id="ai"><div class="bx">
<div id="aih" style="font-size:12px">Describe what to build, and attach a house photo, plans or any file. The AI builds it in the world.</div>
<textarea id="aip" placeholder="e.g. Build this house at 1:1 scale, two floors with a gable roof / ابنِ البيت اللي في الصورة"></textarea>
<div class="rw"><input type="file" id="aif" accept="image/*,.pdf,.txt,.md,.json,.csv,.lua,.luau,.xml" multiple></div>
<div id="aip2" class="rw" style="overflow-x:auto"></div>
<div class="rw"><input type="password" id="aik" placeholder="Anthropic API key (only if used outside Claude)"></div>
<div id="ast"></div>
<div class="rw"><button id="aig" class="on">Generate</button><button id="aix">Close</button></div>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i),R=THREE,XYZ=['x','y','z'],vp=$('vp'),cv=$('cv');
const AX={x:new R.Vector3(1,0,0),y:new R.Vector3(0,1,0),z:new R.Vector3(0,0,1)},COL={x:0xe5484d,y:0x3ecf5f,z:0x3b82f6};
const MATS={Plastic:[.6,0],SmoothPlastic:[.3,0],Wood:[.9,0],Slate:[.85,0],Concrete:[.95,0],Metal:[.35,.8],Grass:[1,0],Brick:[.9,0],Neon:[.3,0],Glass:[.1,0]};
const MTOK={Plastic:256,SmoothPlastic:272,Wood:512,Slate:800,Concrete:816,Metal:1088,Grass:1280,Brick:848,Neon:288,Glass:1568};
$('mat').innerHTML=Object.keys(MATS).map(k=>`<option>${k}</option>`).join('');
const ren=new R.WebGLRenderer({canvas:cv,antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
const sc=new R.Scene();sc.background=new R.Color(0xa5c8ee);
const cam=new R.PerspectiveCamera(60,1,.1,3000);
sc.add(new R.HemisphereLight(0xffffff,0x778899,.9));const sun=new R.DirectionalLight(0xffffff,.7);sun.position.set(60,100,40);sc.add(sun);
const tc=document.createElement('canvas');tc.width=tc.height=64;const cx=tc.getContext('2d');cx.fillStyle='#a3a2a5';cx.fillRect(0,0,64,64);cx.strokeStyle='#8e8d90';cx.lineWidth=3;cx.strokeRect(0,0,64,64);
const tx=new R.CanvasTexture(tc);tx.wrapS=tx.wrapT=R.RepeatWrapping;tx.repeat.set(128,128);
const base=new R.Mesh(new R.PlaneGeometry(512,512),new R.MeshStandardMaterial({map:tx}));base.rotation.x=-Math.PI/2;base.position.y=-.02;sc.add(base);
let th=.7,ph=.55,rad=40,tg=new R.Vector3(0,2,0);
function upCam(){cam.position.set(tg.x+rad*Math.cos(ph)*Math.sin(th),tg.y+rad*Math.sin(ph),tg.z+rad*Math.cos(ph)*Math.cos(th));cam.lookAt(tg);cam.updateMatrixWorld()}
new ResizeObserver(()=>{const w=vp.clientWidth,h=vp.clientHeight;if(w&&h){ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}).observe(vp);upCam();
// geometry + parts
const geo={block:new R.BoxGeometry(1,1,1),ball:new R.SphereGeometry(.5,24,16),cyl:new R.CylinderGeometry(.5,.5,1,28).rotateZ(Math.PI/2),wedge:(()=>{const g=new R.BufferGeometry(),a=[],P=(x,y,z)=>[x,y,z];
const F0=P(-.5,-.5,-.5),B0=P(-.5,-.5,.5),T0=P(-.5,.5,.5),F1=P(.5,-.5,-.5),B1=P(.5,-.5,.5),T1=P(.5,.5,.5);
[[F1,B1,T1],[F0,T0,B0],[F0,F1,B1],[F0,B1,B0],[B0,B1,T1],[B0,T1,T0],[F0,T0,T1],[F0,T1,F1]].forEach(t=>t.forEach(p=>a.push(...p)));
g.setAttribute('position',new R.Float32BufferAttribute(a,3));g.computeVertexNormals();return g})()};
geo.spawn=geo.block;
const NM={block:'Part',ball:'Ball',cyl:'Cylinder',wedge:'Wedge',spawn:'SpawnLocation'},IC={block:'▣',ball:'●',cyl:'⬭',wedge:'◣',spawn:'✚'};
const items=[],sels=new Set();let cur=null,tool='select',multi=false,im=1,ir=45;
function look(m){const u=m.userData,[r,mt]=MATS[u.mat],x=m.material;x.roughness=r;x.metalness=mt;x.transparent=u.tr>0;x.opacity=1-u.tr;x.depthWrite=u.tr==0;x.emissive.set(u.mat=='Neon'?x.color:0);x.emissiveIntensity=.7}
function mk(t,o){o=o||{};const m=new R.Mesh(geo[t],new R.MeshStandardMaterial({color:o.c==null?0xa3a2a5:o.c,flatShading:true,side:R.DoubleSide}));
m.userData={t,name:o.n||NM[t],mat:o.m||'Plastic',tr:o.tr||0,an:o.an!==false,co:o.co!==false,dc:[],dmesh:{}};
const ol=new R.LineSegments(new R.EdgesGeometry(geo[t]),new R.LineBasicMaterial({color:0x2d9cff,depthTest:false}));ol.visible=false;ol.renderOrder=5;m.add(ol);m.userData.ol=ol;
m.position.fromArray(o.p);m.rotation.set(...o.r);m.scale.fromArray(o.s);look(m);(o.dc||[]).forEach(d=>addDecal(m,d.f,d.i));sc.add(m);items.push(m);return m}
function addPart(t,s,n){const m=mk(t,{p:[Math.round(tg.x),s[1]/2,Math.round(tg.z)],r:[0,0,0],s,n});select(m);save()}
// gizmo
const gz=new R.Group(),gm={move:new R.Group(),scale:new R.Group(),rot:new R.Group()},ident=new R.Quaternion();sc.add(gz);Object.values(gm).forEach(g=>gz.add(g));
const bm=c=>new R.MeshBasicMaterial({color:c,depthTest:false,transparent:true}),gh=()=>new R.MeshBasicMaterial({transparent:true,opacity:0,depthTest:false,depthWrite:false});
function hd(g,ge,ma,a,k,s,fn){const m=new R.Mesh(ge,ma);m.renderOrder=10;m.userData={a,k,s};fn(m);g.add(m)}
XYZ.forEach(a=>{const q=new R.Quaternion().setFromUnitVectors(new R.Vector3(0,1,0),AX[a]),q2=new R.Quaternion().setFromUnitVectors(new R.Vector3(0,0,1),AX[a]);
const at=d=>m=>{m.position.copy(AX[a]).multiplyScalar(d);m.quaternion.copy(q)};
hd(gm.move,new R.CylinderGeometry(.05,.05,1.2),bm(COL[a]),a,'move',1,at(.9));hd(gm.move,new R.ConeGeometry(.18,.45),bm(COL[a]),a,'move',1,at(1.7));hd(gm.move,new R.CylinderGeometry(.28,.28,1.8),gh(),a,'move',1,at(1.1));
[1,-1].forEach(s=>{hd(gm.scale,new R.BoxGeometry(.32,.32,.32),bm(COL[a]),a,'scale',s,()=>{});hd(gm.scale,new R.BoxGeometry(.8,.8,.8),gh(),a,'scale',s,()=>{})});
hd(gm.rot,new R.TorusGeometry(1.6,.04,8,64),bm(COL[a]),a,'rot',1,m=>m.quaternion.copy(q2));hd(gm.rot,new R.TorusGeometry(1.6,.22,6,40),gh(),a,'rot',1,m=>m.quaternion.copy(q2))});
// select / ui
function select(m,add){if(!add||!m)sels.clear();if(m){if(add&&sels.has(m))sels.delete(m);else sels.add(m)}cur=[...sels].pop()||null;sync()}
function sync(){items.forEach(x=>x.userData.ol.visible=sels.has(x));
$('exp').innerHTML='<div class="n">▾ ▣ Workspace</div>'+items.map((m,i)=>`<div class="n c${sels.has(m)?' s':''}" data-i="${i}"><span>${IC[m.userData.t]}</span>${m.userData.name.replace(/</g,'&lt;')}</div>`).join('');
if(cur){$('col').value='#'+cur.material.color.getHexString();$('mat').value=cur.userData.mat}$('anc').classList.toggle('on',!!cur&&cur.userData.an);props()}
function props(){const p=$('props');if(!cur){p.innerHTML='<div class="em">Select a part to edit its properties.</div>';return}
const u=cur.userData,r=cur.rotation,v=(k,a)=>`<div class="v">${a.map((x,i)=>`<input type="number" step="any" data-k="${k}" data-i="${i}" value="${+(+x).toFixed(3)}">`).join('')}</div>`,row=(l,h)=>`<div class="r"><label>${l}</label>${h}</div>`;
p.innerHTML=`<div class="sec">Data</div>${row('Name',`<input type="text" data-k="n" value="${u.name.replace(/"/g,'&quot;')}">`)}<div class="sec">Transform</div>${row('Position',v('p',cur.position.toArray()))}${row('Orientation',v('r',[r.x,r.y,r.z].map(a=>a*180/Math.PI)))}${row('Size',v('s',cur.scale.toArray()))}<div class="sec">Appearance</div>${row('Color',`<input type="color" data-k="c" value="#${cur.material.color.getHexString()}">`)}${row('Material',`<select data-k="m">${Object.keys(MATS).map(k=>`<option${k==u.mat?' selected':''}>${k}</option>`).join('')}</select>`)}${row('Transparency',`<input type="number" step="0.1" min="0" max="1" data-k="tr" value="${u.tr}">`)}<div class="sec">Behavior</div>${row('Anchored',`<input type="checkbox" data-k="an"${u.an?' checked':''}>`)}${row('CanCollide',`<input type="checkbox" data-k="co"${u.co?' checked':''}>`)}`}
$('props').addEventListener('change',e=>{const t=e.target,k=t.dataset.k,i=+t.dataset.i;if(!cur||!k)return;const m=cur,u=m.userData,x=parseFloat(t.value)||0;
if(k=='n')u.name=t.value||'Part';else if(k=='p')m.position[XYZ[i]]=x;else if(k=='r')m.rotation[XYZ[i]]=x*Math.PI/180;else if(k=='s')m.scale[XYZ[i]]=Math.max(.05,x);else if(k=='c')m.material.color.set(t.value);else if(k=='m')u.mat=t.value;else if(k=='tr')u.tr=Math.min(1,Math.max(0,x));else u[k]=t.checked;look(m);save()});
$('exp').onclick=e=>{const n=e.target.closest('[data-i]');if(n)select(items[+n.dataset.i],multi)};
const TB=[['Part','block',[4,1,2],'▣'],['Sphere','ball',[4,4,4],'●'],['Cylinder','cyl',[2,4,4],'⬭'],['Wedge','wedge',[4,2,4],'◣'],['Floor','block',[32,1,32],'▭'],['Wall','block',[16,10,1],'▮'],['Spawn','spawn',[6,1,6],'✚']];
$('box').innerHTML='<div class="tg">'+TB.map((t,i)=>`<button data-b="${i}"><b>${t[3]}</b>${t[0]}</button>`).join('')+'</div>';
$('box').onclick=e=>{const b=e.target.closest('[data-b]');if(b){const t=TB[+b.dataset.b];addPart(t[1],t[2].slice(),t[0]=='Part'?null:t[0])}};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{const was=b.classList.contains('on');document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x==b));document.querySelectorAll('.pn').forEach(x=>x.classList.toggle('on',x.id==b.dataset.d));$('dock').classList.toggle('min',was&&!$('dock').classList.contains('min'))});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x==b))});
$('addp').onclick=()=>{const t=$('shp').value,tb=TB.find(x=>x[1]==t);addPart(t,tb[2].slice(),null)};
$('col').oninput=e=>sels.forEach(m=>m.material.color.set(e.target.value));$('col').onchange=()=>{sels.forEach(look);save()};
$('mat').onchange=e=>{sels.forEach(m=>{m.userData.mat=e.target.value;look(m)});save()};
$('anc').onclick=()=>{if(cur){const v=!cur.userData.an;sels.forEach(m=>m.userData.an=v);save()}};
$('im').onchange=e=>im=+e.target.value;$('ir').onchange=e=>ir=+e.target.value;
$('mu').onclick=()=>{multi=!multi;$('mu').classList.toggle('on',multi)};
